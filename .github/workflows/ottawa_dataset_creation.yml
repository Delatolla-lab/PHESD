# This is a workflow to automate the dataset creation of wastewater data for Ottawa.

name: Ottawa-Dataset-creation

# Runs everyday at 2:15pm EST/EDT (19:15 UTC)
on:
  schedule:
    - cron: '55 14 * * *'  # Runs at 9:55 AM EST (14:55 UTC)
    - cron: '55 19 * * *'
    - cron: '15 19 * * *'
  workflow_dispatch:

jobs:
  dataset-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "PHESD-private"

      - name: Download Ottawa wastewater data
        run: |
          mkdir -p Wastewater/Ottawa/Data

          # Download wastewater_virus.csv to a temp file and validate before replacing
          curl -f -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
               -H "Accept: application/vnd.github.raw" \
               -L "https://api.github.com/repos/Delatolla-lab/PHESD-private/contents/Ottawa/Data/wastewater_virus.csv" \
               --output "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" || true

          if [ -s "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" ] && grep -q '^"sampleDate"' "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv"; then
            mv "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" "Wastewater/Ottawa/Data/wastewater_virus.csv"
          else
            echo "Warning: Download of wastewater_virus.csv failed or returned invalid data. Keeping existing file."
            rm -f "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv"
          fi

          # Download wwMeasure.csv to a temp file and validate before replacing
          curl -f -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
               -H "Accept: application/vnd.github.raw" \
               -L "https://api.github.com/repos/Delatolla-lab/PHESD-private/contents/Ottawa/Data/wwMeasure.csv" \
               --output "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" || true

          if [ -s "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" ] && grep -q '^"sampleID"' "Wastewater/Ottawa/Data/wwMeasure.tmp.csv"; then
            mv "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" "Wastewater/Ottawa/Data/wwMeasure.csv"
          else
            echo "Warning: Download of wwMeasure.csv failed or returned invalid data. Keeping existing file."
            rm -f "Wastewater/Ottawa/Data/wwMeasure.tmp.csv"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Wastewater/Ottawa/Data/
          if git diff --staged --quiet; then
            echo "Nothing to update."
          else
            git commit -m "Update Ottawa data"
            git push origin ${{ github.ref_name }}
          fi
