# This is a workflow to automate the dataset creation of wastewater data for Ottawa.

name: Ottawa-Dataset-creation

# Runs everyday at 2:15pm EST/EDT (19:15 UTC)
on:
  schedule:
    - cron: '55 14 * * *'  # Runs at 9:55 AM EST (14:55 UTC)
    - cron: '55 19 * * *'
    - cron: '15 19 * * *'
  workflow_dispatch:
  
jobs:
  dataset-creation:
    runs-on: "macOS-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Ottawa wastewater data
        run: |
          mkdir -p Wastewater/Ottawa/Data
          # Download to temporary files and validate before replacing
          curl -f -H "Authorization: token ${{ secrets.PAT_TOKEN }}" -H "Accept: application/vnd.github.v4.raw" -L "https://api.github.com/repos/Delatolla-lab/PHESD-private/contents/Ottawa/Data/wastewater_virus.csv" --output "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" || true
          if [ -s "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" ] && grep -q '^"sampleDate"' "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv"; then
            mv "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv" "Wastewater/Ottawa/Data/wastewater_virus.csv"
          else
            echo "Warning: Download of wastewater_virus.csv failed or returned non-CSV data. Keeping existing file."
            rm -f "Wastewater/Ottawa/Data/wastewater_virus.tmp.csv"
          fi

          curl -f -H "Authorization: token ${{ secrets.PAT_TOKEN }}" -H "Accept: application/vnd.github.v4.raw" -L "https://api.github.com/repos/Delatolla-lab/PHESD-private/contents/Ottawa/Data/wwMeasure.csv" --output "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" || true
          if [ -s "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" ] && grep -q '^"sampleID"' "Wastewater/Ottawa/Data/wwMeasure.tmp.csv"; then
            mv "Wastewater/Ottawa/Data/wwMeasure.tmp.csv" "Wastewater/Ottawa/Data/wwMeasure.csv"
          else
            echo "Warning: Download of wwMeasure.csv failed or returned non-CSV data. Keeping existing file."
            rm -f "Wastewater/Ottawa/Data/wwMeasure.tmp.csv"
          fi
      - name: Commit files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Update Ottawa data" -a || echo "Nothing to update"
      - uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'main'
